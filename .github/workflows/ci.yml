name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.6.9
      - run: ruff check . || true
      - run: ruff format --check . || true

  backend-tests:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datapulse
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: datapulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datapulse -d datapulse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: datapulse
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: datapulse
      POSTGRES_TEST_DB: datapulse_test
      POSTGRES_SOURCE_DB: datapulse_source
      JWT_SECRET: ci_test_secret_not_for_production
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Create additional databases
        run: |
          PGPASSWORD=test_password psql -h localhost -U datapulse -d postgres -c "CREATE DATABASE datapulse_test;"
          PGPASSWORD=test_password psql -h localhost -U datapulse -d postgres -c "CREATE DATABASE datapulse_source;"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run lint || true
      - working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
